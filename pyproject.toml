[project]
name = "lang-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joeharsonj18@gmail.com", email = "joeharsonj18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-unstructured>=1.0.1",
    "load-dotenv>=0.1.0",
    "sentence-transformers>=6.0.1",
    "unstructured[pdf]>=0.27.5",
    "unstructured-client>=0.46.2",
    "uvicorn[standard]>=0.52.4",
    "python-magic>=0.4.27",
    "tesseract>=0.1.3",
    "rapidocr-onnxruntime>=1.4.4",
    "tiktoken>=0.14.0",
    "easyocr>=1.7.2",
    "langchain-classic>=1.0.8",
]

[project.scripts]
lang-chain = "lang_chain:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
